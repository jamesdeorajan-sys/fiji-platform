name = "vakaviti-offer-agent-preview"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ISOLATED PREVIEW ONLY (CEO directive 2026-08-29, "FAST-TRACK VAKAVITI 24/7 OFFER AGENTS").
# Every binding below is a dedicated, newly-created resource, named to contain
# "vakaviti-offer-agent-preview" per the directive. Nothing here references any production
# database, Worker, route, domain or secret. This file has no [routes]/[[routes]] section and no
# custom domain - it is reachable only at its own *.workers.dev subdomain.

[[d1_databases]]
binding = "DB"
database_name = "vakaviti-offer-agent-preview-db"
database_id = "a7a26f33-1ec3-4c78-a0ee-88497a12ae37"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "preview"
# Emergency stop only - the global kill switch's real, authoritative value lives in the
# kill_switches D1 table (human-writable only, via setGlobalKillSwitch()). This var is a secondary,
# redeploy-level circuit breaker: if ever set to "true", the fetch/scheduled/queue handlers refuse
# to do anything before even reading D1 - useful if D1 itself were ever suspected compromised.
FORCE_DISABLE_ALL_AGENTS = "false"

[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
binding = "ASSETS"

# --- Queue producers: bindings the Worker's own code uses to enqueue work ------------------------
[[queues.producers]]
queue = "vakaviti-offer-agent-preview-discovery"
binding = "DISCOVERY_QUEUE"

[[queues.producers]]
queue = "vakaviti-offer-agent-preview-fetch-extract"
binding = "FETCH_EXTRACT_QUEUE"

[[queues.producers]]
queue = "vakaviti-offer-agent-preview-recheck"
binding = "RECHECK_QUEUE"

# --- Queue consumers: each with its own dead-letter queue, small batches, bounded retries --------
[[queues.consumers]]
queue = "vakaviti-offer-agent-preview-discovery"
dead_letter_queue = "vakaviti-offer-agent-preview-discovery-dlq"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 5

[[queues.consumers]]
queue = "vakaviti-offer-agent-preview-fetch-extract"
dead_letter_queue = "vakaviti-offer-agent-preview-fetch-extract-dlq"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 5

[[queues.consumers]]
queue = "vakaviti-offer-agent-preview-recheck"
dead_letter_queue = "vakaviti-offer-agent-preview-recheck-dlq"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 5

# --- Scheduled triggers ----------------------------------------------------------------------------
# CORRECTED 2026-08-29: this originally listed three separate sub-hourly expressions
# ("*/10 * * * *", "*/12 * * * *", "*/15 * * * *"), intended to demonstrate frequent, observable
# unattended cycles for a preview. Live evidence (agent_runs timestamps across 5 consecutive real
# hours) showed Cloudflare was NOT honoring the sub-hourly cadence at all - all three collapsed to a
# single joint invocation exactly once per hour, at :00, every hour, with zero exceptions across the
# observation window. This matches Cloudflare Cron Triggers' documented minimum interval, which
# rejects/coalesces anything finer than hourly. Keeping the misleading three-expression config would
# claim a cadence that was never actually happening - replaced with the one real, honest, achieved
# cadence instead. Per-offer recheck cadence (imminent-expiry >=6h, volatile/ordinary daily, stable
# <=72h) is unaffected either way - it's enforced by RecheckerPort.isDue()'s own volatility-class
# window (offer-workflow.ts), not by how often this cron fires, so it was never dependent on the
# sub-hourly config being real.
#
# A second, INDEPENDENT scheduling mechanism now also exists as a fallback/redundancy layer:
# Anthropic cloud routine trig_015cLkCXrTsU9hGuWuZbT5sA fires hourly at :30 (offset from this
# native :00 firing) and calls POST /internal/tick/all - see index.ts. Both paths run the exact same
# idempotent tick bodies, so running both is harmless, not a double-count risk.
[triggers]
crons = ["0 * * * *"]
