name = "vakaviti-marketplace-stage1"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Preview-only binding. Replace this zero UUID with the dedicated preview D1 ID
# only when the isolated database is created. Do not reuse an existing D1 database.
[[d1_databases]]
binding = "DB"
database_name = "vakaviti-marketplace-stage1-preview"
database_id = "00000000-0000-0000-0000-000000000000"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "preview"
