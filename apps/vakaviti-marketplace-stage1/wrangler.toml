name = "vakaviti-marketplace-stage1"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Dedicated Stage 1 preview D1 created in Cloudflare on 2026-08-17.
# Do not reuse any existing production D1 database.
[[d1_databases]]
binding = "DB"
database_name = "vakaviti-marketplace-stage1-db"
database_id = "f2753057-4319-404d-bcda-84cccd288fe1"

# =================================================================================================
# LIVE DEAL EXCHANGE - PRE-MERGE CHECKLIST (read before merging this branch into
# ceo/vakaviti-marketplace-stage1)
# =================================================================================================
# Same finding as PR #21 (2026-08-24): Cloudflare Workers Builds for this project reads only the
# TOP-LEVEL wrangler.toml config for every branch, so this binding is top-level and WILL merge into
# production exactly as written unless the steps below are followed first.
#
# DO NOT merge this wrangler.toml into ceo/vakaviti-marketplace-stage1 as-is. Before merging:
#   1. Create a real production database: `vakaviti-live-deal-exchange-db` (a NEW resource - never
#      reuse the preview database id 3f9a36c7-829c-4f9d-8af0-bb5332860f4b in production).
#   2. Apply migrations/deal-exchange/0001-0004 to that NEW production database only.
#   3. Change database_id below to the NEW production database's id.
#   4. Re-run the full test/QA suite against the real production binding shape.
#   5. Rollback if needed: remove this [[d1_databases]] block and redeploy - the deal-exchange
#      router is only mounted when DEAL_EXCHANGE_DB is bound (see src/index.ts), so removing the
#      binding is sufficient to fully disable the feature.
# Until all 5 steps are complete and separately CEO-authorized, this branch must not be merged.
[[d1_databases]]
binding = "DEAL_EXCHANGE_DB"
database_name = "vakaviti-live-deal-exchange-preview-db"
database_id = "3f9a36c7-829c-4f9d-8af0-bb5332860f4b"

# FINAL INTEGRATION REVIEW, Phase 1 (2026-08-25): DEAL_EXCHANGE_QA_DB, QA_TEST_MODE and
# QA_AUTH_SECRET are DELIBERATELY ABSENT from this top-level config. They exist ONLY under
# [env.qa] below. This is a structural guarantee, not a runtime flag a caller can spoof: a Workers
# binding that isn't declared for a given deployment does not exist in that deployment's env
# object at all, full stop - no header, credential, or code path on THIS deployment (the ordinary
# branch preview, and eventually production) can ever reach a QA database, because there is
# nothing here for it to bind to. See src/deal-exchange-ui.ts's verifyQaAuth()/getEnquiryDb() for
# the additional application-level gates that apply only inside [env.qa] itself.

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "preview"
# Stage 1 preview-only enquiry routing rule: while ENVIRONMENT=preview, every visitor
# WhatsApp enquiry routes here regardless of operator/product, so James sees every lead
# during controlled testing. This does NOT change any operator's own stored contact in D1
# (see src/index.ts resolveEnquiryDestination). A future production routing policy requires
# its own explicit decision/configuration - it is not inferred from this value.
MARKETPLACE_ENQUIRY_WHATSAPP = "+61413335007"
# Milestone 4 entry gate 4: explicit feature flag, deliberately separate from DEAL_EXCHANGE_DB's
# mere presence. The future production rollout plan (see DEAL_EXCHANGE_PRODUCTION_PLAN.md)
# deploys the D1 binding FIRST with this flag left unset/false, runs read-only verification, and
# only THEN flips it - so "the binding exists" and "the public routes are live" are two
# independently-controlled steps, never one implicit consequence of the other.
DEAL_EXCHANGE_PUBLIC_ENABLED = "true"

# Phase 2 (Final Integration Review): non-secret, Cloudflare-native build identity - exposes a
# unique version id/tag at runtime with zero injected secrets and no chicken-and-egg problem
# (unlike trying to embed this commit's own SHA inside a file committed as part of this same
# commit). See /internal/build-info in src/deal-exchange-ui.ts and e2e/global-setup.ts.
[[version_metadata]]
binding = "CF_VERSION_METADATA"

# Built-in Workers Static Assets - repo-local files only, no R2/Cloudflare Images/external
# storage. Files under public/ are served directly at their path (e.g. public/images/x.webp
# -> /images/x.webp) before requests reach the Worker's fetch handler.
[assets]
directory = "./public"
binding = "ASSETS"

# Deal Intelligence Cron Trigger - RE-ENABLED on a bounded rotating schedule (CEO directive
# 2026-08-20, Phase 3), after the P0 containment (full-batch design disabled) and Phase 6's
# controlled tests both passed. Cloudflare Cron Triggers are specified in UTC only.
#
# "0 */4 * * *" (UTC) fires every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
# In Fiji Standard Time (FJT = UTC+12, no current DST): 12:00, 16:00, 20:00, 00:00, 04:00, 08:00
# FJT respectively - i.e. 6 activations per day, evenly spaced.
#
# Each activation processes at most 3 due sources (MAX_SOURCES_PER_ACTIVATION in
# src/deal-agent.ts, raised from 2 -> 3 on 2026-08-21 as stage 1 of the P1.3D SCALE directive's
# conservative staged increase), selected by next_scan_at ascending. With 6 activations/day x 3
# sources/activation = up to 18 source-slots/day against 7 currently-approved sources, every
# source clears its next_scan_at (advanced +24h on each successful or classified-failure scan)
# well within a day, with headroom to spare - this is the fair-rotation mechanism, not a fixed
# per-source time slot. A stuck-run watchdog (recoverStuckRuns, 10-minute threshold) runs at the
# start of every activation, scheduled or manual, so an abandoned run is corrected before it can
# block the next one.
[triggers]
crons = ["0 */4 * * *"]

# =================================================================================================
# DEDICATED QA ENVIRONMENT (Final Integration Review, Phase 1 item 2)
# =================================================================================================
# A fully separate Cloudflare Worker deployment (Cloudflare deploys a distinct script named
# "<name>-qa" for any [env.qa] block by default) - QA_DB binding only, no production/preview DB
# binding, no custom domain, no Cron (this block deliberately carries no [triggers] section, and
# wrangler does not inherit top-level triggers into named environments), no public indexing (no
# [assets] directory is served under a public route here beyond what the Worker itself renders,
# and DEAL_EXCHANGE_PUBLIC_ENABLED stays false).
#
# DEPLOYMENT STATUS (honest, as of this push): this block is not yet deployed anywhere. Cloudflare
# Workers Builds (the git integration driving the ordinary branch preview) has been empirically
# confirmed this engagement to read only the TOP-LEVEL config - it will not deploy this block on
# its own. Actually deploying it requires `wrangler deploy --env qa` to run somewhere with a
# Cloudflare API token: either a new GitHub Actions secret on this repo (none exist today - see
# the FINAL REPORT for the exact question this raises) or a one-time manual deploy. QA_AUTH_SECRET
# is set via `wrangler secret put QA_AUTH_SECRET --env qa` for the same reason - it is never
# written here in plaintext, and never derived from or equal to ADMIN_TOKEN.
[env.qa]
name = "vakaviti-live-deal-exchange-qa"

[env.qa.vars]
ENVIRONMENT = "qa"
QA_TEST_MODE = "true"
DEAL_EXCHANGE_PUBLIC_ENABLED = "false"

[[env.qa.d1_databases]]
binding = "DEAL_EXCHANGE_QA_DB"
database_name = "vakaviti-live-deal-exchange-qa-db"
database_id = "2fccc7a7-e943-48bd-a810-687dd6c01b36"

[[env.qa.version_metadata]]
binding = "CF_VERSION_METADATA"

[env.qa.assets]
directory = "./public"
binding = "ASSETS"
