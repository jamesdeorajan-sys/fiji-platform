<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiji Dash — Escalations</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --ocean: #0d4d6e; --paper: #faf6f0; --ink: #1a1a1a; --line: #d8d0c2; --green: #2e8b57; --red: #c83e3e; --amber: #b8860b; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); margin: 0; padding: 24px 16px 80px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 24px; }
  #gate { max-width: 360px; margin: 80px auto; text-align: center; }
  #gate input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
  #gate button { width: 100%; background: var(--ocean); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #gate button:disabled { opacity: 0.5; cursor: not-allowed; }
  #gateMsg { font-size: 13px; margin-top: 10px; display: none; }
  #gateMsg.ok { color: var(--green); }
  #gateMsg.err { color: var(--red); }
  .link-btn { background: none !important; border: none !important; color: var(--ocean) !important; font-size: 13px !important; font-weight: 400 !important; text-decoration: underline; padding: 0 !important; margin-top: 14px !important; cursor: pointer; }
  #phoneLoginWrap, #tokenLoginWrap { margin-top: 14px; text-align: left; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar label { font-size: 13px; color: #666; }
  .toolbar select, .toolbar button, .toolbar input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; background: #fffdf8; }
  .toolbar input { min-width: 220px; }
  .toolbar button { cursor: pointer; font-weight: 600; }
  .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

  .err-banner { background: #fdeaea; color: #8a1f1f; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }

  .queue { display: flex; flex-direction: column; gap: 10px; }
  .esc-card { background: #fffdf8; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px; padding: 14px 16px; }
  .esc-card.resolved { border-left-color: var(--green); opacity: 0.75; }
  .esc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .esc-type { font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 12px; color: var(--ocean); }
  .esc-time { color: #999; font-size: 12px; white-space: nowrap; }
  .esc-context { font-size: 13px; color: #333; margin-bottom: 8px; line-height: 1.4; }
  .esc-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #888; }
  .source-badge { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; background: #e6f0ff; color: var(--ocean); }
  .empty { color: #888; font-size: 14px; padding: 40px 0; text-align: center; }
  .esc-bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
  .resolve-btn { background: var(--green); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .resolve-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .resolved-tag { font-size: 12px; color: var(--green); font-weight: 600; }
</style>
</head>
<body>

<div id="gate">
  <h1>Admin login</h1>
  <p class="sub">Enter your PIN.</p>
  <input type="password" id="pinInput" placeholder="PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12">
  <button id="pinLoginBtn">Log in</button>
  <div id="gateMsg"></div>
  <button id="showPhoneLoginBtn" type="button" class="link-btn">Or send a login link via WhatsApp instead</button>
  <div id="phoneLoginWrap" style="display:none;">
    <input type="tel" id="phoneInput" placeholder="Phone number" autocomplete="tel">
    <button id="loginBtn">Send login link</button>
  </div>
  <button id="showTokenLoginBtn" type="button" class="link-btn">Or log in with an admin token</button>
  <div id="tokenLoginWrap" style="display:none;">
    <input type="password" id="tokenInput" placeholder="Admin token" autocomplete="off">
    <button id="tokenLoginBtn">Enter</button>
  </div>
</div>

<div class="wrap" id="main" style="display:none;">
  <h1>Escalations</h1>
  <p class="sub" id="subline">Loading…</p>

  <div class="toolbar">
    <label for="resolvedFilter">Show</label>
    <select id="resolvedFilter">
      <option value="0">Open</option>
      <option value="1">Resolved</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search guest name, phone, or context…">
    <button id="refreshBtn">Refresh</button>
    <button id="logoutBtn" type="button">Log out</button>
  </div>

  <div class="err-banner" id="errBanner"></div>
  <div id="list"></div>
</div>

<script>
  const API_URL = 'https://nadi-dispatch-api.helpronline.workers.dev';
  let ADMIN_TOKEN = sessionStorage.getItem('nadi_admin_token') || '';

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function urlParam(name) {
    return new URL(window.location.href).searchParams.get(name);
  }

  async function init() {
    const tokenFromLink = urlParam('token');
    if (tokenFromLink) {
      ADMIN_TOKEN = tokenFromLink;
      sessionStorage.setItem('nadi_admin_token', ADMIN_TOKEN);
      history.replaceState({}, '', window.location.pathname);
    }
    await tryLoad();
  }

  async function tryLoad() {
    if (!ADMIN_TOKEN) return false;
    const ok = await loadEscalations();
    if (ok) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      return true;
    }
    return false;
  }

  // Milestone 24 - PIN login, the default/primary path now: no WhatsApp
  // dependency, works the moment a PIN is set (via admin-dashboard.html).
  // POST /admin/login-pin returns the token directly in the response
  // (unlike the magic link, there's no WhatsApp round-trip to wait on).
  document.getElementById('pinLoginBtn').addEventListener('click', async () => {
    const pin = document.getElementById('pinInput').value.trim();
    const msgEl = document.getElementById('gateMsg');
    if (!pin) return;
    document.getElementById('pinLoginBtn').disabled = true;
    try {
      const res = await fetch(API_URL + '/admin/login-pin', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }),
      });
      const data = await res.json();
      if (data.ok && data.token) {
        ADMIN_TOKEN = data.token;
        sessionStorage.setItem('nadi_admin_token', ADMIN_TOKEN);
        document.getElementById('pinInput').value = '';
        await tryLoad();
      } else {
        msgEl.className = 'err';
        msgEl.textContent = data.error || 'Something went wrong.';
        msgEl.style.display = 'block';
      }
    } catch {
      msgEl.className = 'err'; msgEl.textContent = 'Connection error.'; msgEl.style.display = 'block';
    } finally {
      document.getElementById('pinLoginBtn').disabled = false;
    }
  });

  // Milestone 23 - phone-number magic-link login, kept as a secondary
  // option (collapsed by default) alongside the PIN above. POST
  // /admin/login is intentionally generic either way (same
  // privacy-by-default posture as driver login) - a real login link
  // only actually arrives via WhatsApp for the one authorized number.
  document.getElementById('showPhoneLoginBtn').addEventListener('click', () => {
    document.getElementById('phoneLoginWrap').style.display = 'block';
    document.getElementById('showPhoneLoginBtn').style.display = 'none';
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const phone = document.getElementById('phoneInput').value.trim();
    const msgEl = document.getElementById('gateMsg');
    if (!phone) return;
    document.getElementById('loginBtn').disabled = true;
    try {
      const res = await fetch(API_URL + '/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }),
      });
      const data = await res.json();
      msgEl.className = data.ok ? 'ok' : 'err';
      msgEl.textContent = data.message || data.error || 'Something went wrong.';
      msgEl.style.display = 'block';
    } catch {
      msgEl.className = 'err'; msgEl.textContent = 'Connection error.'; msgEl.style.display = 'block';
    } finally {
      document.getElementById('loginBtn').disabled = false;
    }
  });

  // Real gap found live: the static env.ADMIN_TOKEN break-glass path
  // (requireAdmin() has always accepted it, unchanged since Milestone 23)
  // had no UI left to use it through at all - the raw-token input was
  // removed when the magic link replaced it, and never restored. James
  // was locked out of setting his first PIN, since neither the PIN field
  // (correctly empty/unset) nor the WhatsApp link (template not yet
  // submitted) could get him in. This restores a third, collapsed option
  // using the token he already has - no backend change needed, since
  // requireAdmin() already accepts it.
  document.getElementById('showTokenLoginBtn').addEventListener('click', () => {
    document.getElementById('tokenLoginWrap').style.display = 'block';
    document.getElementById('showTokenLoginBtn').style.display = 'none';
  });

  document.getElementById('tokenLoginBtn').addEventListener('click', async () => {
    const token = document.getElementById('tokenInput').value.trim();
    const msgEl = document.getElementById('gateMsg');
    if (!token) return;
    document.getElementById('tokenLoginBtn').disabled = true;
    ADMIN_TOKEN = token;
    const ok = await tryLoad();
    if (ok) {
      sessionStorage.setItem('nadi_admin_token', ADMIN_TOKEN);
    } else {
      ADMIN_TOKEN = '';
      msgEl.className = 'err';
      msgEl.textContent = 'Invalid token or connection error.';
      msgEl.style.display = 'block';
    }
    document.getElementById('tokenLoginBtn').disabled = false;
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('nadi_admin_token');
    ADMIN_TOKEN = '';
    document.getElementById('gate').style.display = 'block';
    document.getElementById('main').style.display = 'none';
  });

  document.getElementById('resolvedFilter').addEventListener('change', loadEscalations);
  document.getElementById('refreshBtn').addEventListener('click', loadEscalations);

  let searchDebounceTimer = null;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(loadEscalations, 400);
  });

  async function loadEscalations() {
    const errBanner = document.getElementById('errBanner');
    errBanner.style.display = 'none';
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.disabled = true;
    try {
      const resolved = document.getElementById('resolvedFilter').value;
      const search = document.getElementById('searchInput').value.trim();
      const params = new URLSearchParams({ resolved });
      if (search) params.set('search', search);
      const res = await fetch(API_URL + '/admin/escalations?' + params.toString(), {
        headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN },
      });
      if (!res.ok) {
        if (document.getElementById('main').style.display !== 'none') {
          errBanner.textContent = 'Could not load escalations (status ' + res.status + ').';
          errBanner.style.display = 'block';
        }
        return false;
      }
      const data = await res.json();
      renderEscalations(data.escalations || []);
      return true;
    } catch (e) {
      if (document.getElementById('main').style.display !== 'none') {
        errBanner.textContent = 'Connection error.';
        errBanner.style.display = 'block';
      }
      return false;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function triggerTypeLabel(type) {
    return String(type || '').replace(/_/g, ' ');
  }

  function renderEscalations(escalations) {
    const isResolvedView = document.getElementById('resolvedFilter').value === '1';
    document.getElementById('subline').textContent = escalations.length + ' ' +
      (isResolvedView ? 'resolved' : 'open') + ' escalation' + (escalations.length === 1 ? '' : 's');

    const listEl = document.getElementById('list');
    if (escalations.length === 0) {
      listEl.innerHTML = '<div class="empty">No ' + (isResolvedView ? 'resolved' : 'open') + ' escalations.</div>';
      return;
    }

    listEl.innerHTML = '<div class="queue">' + escalations.map(e => `
      <div class="esc-card ${e.resolved ? 'resolved' : ''}" id="esc-card-${e.id}">
        <div class="esc-top">
          <span class="esc-type">${escHtml(triggerTypeLabel(e.trigger_type))}</span>
          <span class="esc-time">${escHtml(e.created_at)}</span>
        </div>
        <div class="esc-context">${escHtml(e.context || '—')}</div>
        <div class="esc-meta">
          <span><span class="source-badge">${escHtml(e.source)}</span></span>
          ${e.booking_id ? `<span>Booking #${e.booking_id}${e.pickup_zone ? ': ' + escHtml(e.pickup_zone) + ' → ' + escHtml(e.destination_zone) : ''}${e.booking_guest_name ? ' (' + escHtml(e.booking_guest_name) + ')' : ''}</span>` : ''}
          ${e.driver_id ? `<span>Driver: ${escHtml(e.driver_name || ('#' + e.driver_id))}</span>` : ''}
        </div>
        <div class="esc-bottom">
          ${e.resolved
            ? '<span class="resolved-tag">✓ Resolved</span>'
            : `<button class="resolve-btn" data-escalation-id="${e.id}" onclick="resolveEscalation(${e.id}, this)">Resolve</button>`}
        </div>
      </div>
    `).join('') + '</div>';
  }

  // Milestone 31 - the one action the queue was missing: closing an
  // escalation out. Fades the card in place rather than re-fetching the
  // whole list, since the open-queue view (the default) would otherwise
  // need the resolved card to disappear, and the resolved-history view
  // would need it to appear - simplest correct behavior for both is just
  // reflecting the new state on the card itself.
  async function resolveEscalation(id, btnEl) {
    btnEl.disabled = true;
    try {
      const res = await fetch(API_URL + '/admin/escalations/' + id + '/resolve', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + ADMIN_TOKEN },
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        btnEl.disabled = false;
        alert(data.error || 'Could not resolve this escalation.');
        return;
      }
      const card = document.getElementById('esc-card-' + id);
      if (card) {
        card.classList.add('resolved');
        const bottom = card.querySelector('.esc-bottom');
        if (bottom) bottom.innerHTML = '<span class="resolved-tag">✓ Resolved</span>';
      }
    } catch (e) {
      btnEl.disabled = false;
      alert('Connection error - could not resolve this escalation.');
    }
  }

  init();
</script>
</body>
</html>
