name: BulaBooking foundation checks
on:
  workflow_dispatch:
  push:
    branches:
      - codex/bulabooking-marketplace-foundation
    paths:
      - 'bulabooking/**'
      - '.github/workflows/bulabooking-foundation-checks.yml'
  pull_request:
    paths:
      - 'bulabooking/**'
      - '.github/workflows/bulabooking-foundation-checks.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bulabooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run domain tests
        run: node --test tests/*.test.mjs
      - name: Build Astro preview
        run: npm run build
