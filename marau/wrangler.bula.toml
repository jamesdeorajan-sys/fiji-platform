# Bula Happiness — NEW isolated hosted-acceptance Worker + NEW synthetic D1. Deploy only via bula/ops/run_acceptance.mjs.
# Nothing here points at any existing preview/production binding. No routes, no custom domains, workers.dev only.
name = "marau-bula-acceptance"
main = "worker/worker.js"
compatibility_date = "2026-07-19"
account_id = "595101df2c562b3c65595420d43f9fe1"

[[d1_databases]]
binding = "DB"
database_name = "bula-acceptance-synthetic-1"
database_id = "6c54341a-6c21-4314-b514-bb44ed5fa1b5"    # created 2026-11-01 for this acceptance only (an identifier, not a secret)

# 06:00 UTC = 18:00 Pacific/Fiji (the handler re-derives Fiji time from tzdata). The */15 sweep catches up a missed run and settles expiries.
[triggers]
crons = ["0 6 * * *", "*/15 * * * *"]

# ACCEPTANCE flags: only what hosted synthetic tests need. Outbox/email stay OFF (no provider, no capture sender in a deployed Worker).
# `run_acceptance.mjs lockdown` redeploys with every feature flag AND the fault harness OFF.
[vars]
BULA_SYNTHETIC_TEST = "on"
BULA_CHECKOUT_ENABLED = "on"
BULA_CREDITS_ENABLED = "on"
BULA_EDITION_PUBLISH_ENABLED = "on"
BULA_FAULT_HARNESS = "on"
BULA_DEVICE_PAIRING = "on"
BULA_OUTBOX_ENABLED = "off"
BULA_EMAIL_SEND_ENABLED = "off"
BULA_POLICY_VERSION = "synthetic-acceptance-1"
BULA_CATALOGUE_HIDDEN_OPERATORS = "op_acc,op_acc_sched"
BULA_CRON_ONLY_OPERATORS = "op_acc_sched"   # the scheduler-test offer is published ONLY by the cron: guest reads (e.g. a phone left open) and manual publish skip it   # acceptance fault-test fixtures stay out of the guest catalogue (still bookable by id for the automated checks)
BULA_BUILD = "unset"
BULA_COMMIT = "unset"
# Secret (set by run_acceptance.mjs via stdin, never in this file/argv/chat): MARAU_ADMIN_TEST_TOKEN
